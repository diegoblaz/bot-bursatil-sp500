
name: Bot bursatil SP500

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo de analisis"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - watch
  schedule:
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bot-bursatil-sp500
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_FUNDAMENTALS: ${{ vars.TEST_FUNDAMENTALS }}
          TEST_API: ${{ vars.TEST_API }}
        run: |
          if [ "${{ inputs.modo }}" = "watch" ]; then
            python bot.py --mode watch
          else
            python bot.py --mode full
          fi

      - name: Guardar informes y estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          git diff --cached --quiet || git commit -m "Actualizar informes del bot"
          git push
